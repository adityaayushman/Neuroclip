[project]
name = "neuroclip-api"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "pydantic-settings>=2.6", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
